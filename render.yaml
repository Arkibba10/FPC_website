services:
  - type: web
    name: fpc-backend
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed && gunicorn fpc.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/members/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: fpc.settings
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: fpc-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fpc-website.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://fpc-website.vercel.app"
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: fpc-db
    plan: free
    databaseName: fpc
    user: fpc
